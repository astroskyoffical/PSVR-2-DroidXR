<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1232" viewBox="0 0 400 1232" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">From the game to PSVR2</title>
<desc id="overview-desc">Inside the Android phone, the Linux container runs Skyrim VR, custom DXVK, a game Turnip ICD, OpenComposite, Monado and a separate compositor Turnip ICD. The game GPU renders views and depth before OpenComposite submits them through OpenXR. Monado applies SGSR2, RCAS and later lens distortion. The shared Android kernel handles DRM/KMS and later DSC display-link compression. DisplayPort carries the result to PSVR2 outside the phone. A separate dashed path shows the game OpenVR calls to OpenComposite.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#263951"/></marker></defs>
