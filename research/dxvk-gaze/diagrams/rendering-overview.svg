="287" font-size="21" text-anchor="middle" font-weight="700" fill="#17263b" >Custom DXVK</text><text x="218" y="312" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >D3D11 → Vulkan</text><text x="218" y="335" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Gaze-aware shading maps</text><rect x="68" y="382" width="300" height="86" rx="12" fill="#eef5ff" stroke="#b9c6d8" stroke-width="2" /><text x="218" y="411" font-size="21" text-anchor="middle" font-weight="700" fill="#17263b" >Game Turnip ICD</text><text x="218" y="436" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Phone GPU renders</text><text x="218" y="459" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >eye images and depth</text><rect x="68" y="510" width="300" height="86" rx="12" fill="#fff" stroke="#b9c6d8" stroke-width="2" /><text x="218" y="539" font-size="21" text-anchor="middle" font-weight="700" fill="#17263b" >OpenComposite</text><text x="218" y="564" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >OpenVR → OpenXR</text><text x="218" y="587" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Submits the rendered views</text><rect x="68" y="636" width="300" height="98" rx="12" fill="#eefaf7" stroke="#b9c6d8" stroke-width="2" /><text x="218" y="665" font-size="21" text-anchor="middle" font-weight="700" fill="#17263b" >Monado compositor</text><text x="218" y="690" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >SGSR2 → RCAS</text><text x="218" y="713" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >then lens distortion</text><rect x="68" y="774" width="300" height="80" rx="12" fill="#eefaf7" stroke="#b9c6d8" stroke-width="2" /><text x="218" y="803" font-size="21" text-anchor="middle" font-weight="700" fill="#17263b" >Compositor Turnip ICD</text><text x="218" y="828" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Separate driver selection</text><text x="32" y="904" font-size="18" text-anchor="start" font-weight="400" fill="#17263b">Shared kernel</text><rect x="68" y="922" width="300" height="96" rx="12" fill="#fff6e9" stroke="#b9c6d8" stroke-width="2" /><text x="218" y="951" font-size="22" text-anchor="middle" font-weight="700" fill="#17263b" >Display path</text><text x="218" y="977" font-size="19" text-anchor="middle" font-weight="400" fill="#17263b" >DRM/KMS → DSC</text><text x="218" y="1001" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Later display-link compression</text><text x="232" y="1083" font-size="18" text-anchor="start" font-weight="400" fill="#17263b" >DisplayPort</text><rect x="68" y="1112" width="300" height="78" rx="12" fill="#f1f5fa" stroke="#70839d" stroke-width="2" /><text x="218" y="1144" font-size="23" text-anchor="middle" font-weight="700" fill="#17263b" >PSVR2</text><text x="218" y="1170" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Displays the final eye images</text><text x="200" y="1214" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Existing integrated phone setup</text></g>
