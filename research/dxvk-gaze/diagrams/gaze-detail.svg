<svg xmlns="http://www.w3.org/2000/svg" width="400" height="944" viewBox="0 0 400 944" role="img" aria-labelledby="gaze-title gaze-desc">
<title id="gaze-title">Gaze reaches two different processing paths</title>
<desc id="gaze-desc">PSVR2 eye tracking reaches Monado through the existing tracking bridge. Monado writes eye-view coordinates to the shared gaze record. Custom DXVK reads the record through Wine and updates a shading-rate map for selected game passes. Monado also reads the record to position full inner SGSR2 and cheaper outer spatial reconstruction. A separate Monado radius record scales the zones in both paths. The exact shared paths and record layouts remain in the technical reference.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#263951"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="8" y="8" width="384" height="918" rx="12" fill="#fff" stroke="#b2c1d3" stroke-width="2" /><text x="26" y="42" font-size="22" text-anchor="start" font-weight="700" fill="#17263b" >Where gaze controls quality</text><path d="M200 156V186" fill="none" stroke="#263951" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M200 284V316" fill="none" stroke="#263951" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="76" width="320" height="80" rx="12" fill="#fff" stroke="#b9c6d8" stroke-width="2" /><text x="200" y="108" font-size="22" text-anchor="middle" font-weight="700" fill="#17263b" >PSVR2 eye tracking</text><text x="200" y="135" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Through the existing bridge</text><rect x="40" y="194" width="320" height="90" rx="12" fill="#fff" stroke="#b9c6d8" stroke-width="2" /><text x="200" y="226" font-size="22" text-anchor="middle" font-weight="700" fill="#17263b" >Monado gaze producer</text><text x="200" y="253" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Projects gaze into eye views</text><rect x="24" y="324" width="352" height="88" rx="12" fill="#f1f5fa" stroke="#b9c6d8" stroke-width="2" /><text x="200" y="355" font-size="21" text-anchor="middle" font-weight="700" fill="#17263b" >Shared gaze record</text><text x="200" y="385" font-size="20" text-anchor="middle" font-weight="400" fill="#17263b" font-family="Consolas, monospace">/dev/shm/psvr2-gaze</text><path d="M200 412V444H105V472" fill="none" stroke="#263951" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M200 444H295V472" fill="none" stroke="#263951" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="480" width="170" height="88" rx="12" fill="#eef5ff" stroke="#b9c6d8" stroke-width="2" /><text x="105" y="512" font-size="20" text-anchor="middle" font-weight="700" fill="#17263b" >Custom DXVK</text><text x="105" y="540" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Shading-rate map</text><path d="M105 568V602" fill="none" stroke="#263951" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="210" y="480" width="170" height="88" rx="12" fill="#eefaf7" stroke="#b9c6d8" stroke-width="2" /><text x="295" y="512" font-size="20" text-anchor="middle" font-weight="700" fill="#17263b" >Monado</text><text x="295" y="540" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >SGSR2 zones</text><path d="M295 568V602" fill="none" stroke="#263951" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="610" width="170" height="124" rx="12" fill="#eef5ff" stroke="#b9c6d8" stroke-width="2" /><text x="105" y="643" font-size="20" text-anchor="middle" font-weight="700" fill="#17263b" >Game shading</text><text x="105" y="674" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Selected graphics</text><text x="105" y="700" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >passes</text><rect x="210" y="610" width="170" height="124" rx="12" fill="#eefaf7" stroke="#b9c6d8" stroke-width="2" /><text x="295" y="637" font-size="20" text-anchor="middle" font-weight="700" fill="#17263b" >Image</text><text x="295" y="660" font-size="20" text-anchor="middle" font-weight="700" fill="#17263b" >reconstruction</text><text x="295" y="688" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Full inner SGSR2</text><text x="295" y="714" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Spatial outer zone</text><rect x="24" y="778" width="352" height="126" rx="12" fill="#f6f6fa" stroke="#a8a7ba" stroke-width="2" stroke-dasharray="6 4"/><text x="200" y="810" font-size="21" text-anchor="middle" font-weight="700" fill="#17263b" >Separate radius control</text><text x="200" y="840" font-size="19" text-anchor="middle" font-weight="400" fill="#17263b" font-family="Consolas, monospace">/dev/shm/psvr2-fovea</text><text x="200" y="868" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >Monado scales the zones</text><text x="200" y="893" font-size="18" text-anchor="middle" font-weight="400" fill="#17263b" >in both branches.</text></g>
</svg>
