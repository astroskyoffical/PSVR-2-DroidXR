name: Publish site with original media

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build static site with verified original media
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          cp -R docs/. _site/
          media='_site/assets/quest-original-4afc4901.mp4'
          expected_sha='4afc4901fb9cb916629177755f55b6a75353d90526e0f0aaf69426e1626893e4'
          test ! -e "$media"
          fetch_verified_media() {
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --retry 2 --connect-timeout 15 --max-time 180 --max-filesize 424772859 \
              --output "$media" "$1" &&
            test "$(wc -c < "$media")" -eq 424772859 &&
            printf '%s  %s\n' "$expected_sha" "$media" | sha256sum --check --status
          }
          # Prefer the previous verified Pages deployment for every later rebuild.
          fetch_verified_media 'https://astroskyoffical.github.io/PSVR-2-DroidXR/assets/quest-original-4afc4901.mp4'
          python3 - <<'PY'
          from pathlib import Path
          paths = list(Path('_site').rglob('*'))
          assert not any(p.is_symlink() for p in paths), 'Links are not allowed in the site artifact'
          size = sum(p.stat().st_size for p in paths if p.is_file())
          assert size < 1_000_000_000, 'Site exceeds the conservative 1 GB budget'
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          assert 'data-src="assets/quest-original-4afc4901.mp4"' in html
          page.write_text(html, encoding='utf-8')
          print(f'Verified original media; complete site: {size} bytes')
          PY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
